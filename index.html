<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Anime World</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
    }
    header {
      background: linear-gradient(90deg, #ff0055, #6a00ff);
      padding: 20px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }
    .container {
      padding: 20px;
    }
    h2 {
      border-right: 5px solid #ff0055;
      padding-right: 10px;
    }
    .anime-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }
    .anime-card {
      background: #1c1c1c;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s;
    }
    .anime-card:hover {
      transform: scale(1.05);
    }
    .anime-card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }
    .anime-card p {
      padding: 10px;
      text-align: center;
    }
    footer {
      background: #111;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
      color: #aaa;
    }
  </style>
</head>
<body>

<header>
  🌸 Anime World 🌸
</header>

<div class="container">
  <h2>أنميات مميزة</h2>

  <div class="anime-list">
    <div class="anime-card">
      <img src="https://i.imgur.com/8QZ7Z9y.jpg">
      <p>Jujutsu Kaisen</p>
    </div>

    <div class="anime-card">
      <img src="https://i.imgur.com/9yG3B0N.jpg">
      <p>Demon Slayer</p>
    </div>

    <div class="anime-card">
      <img src="https://i.imgur.com/XyZQKkT.jpg">
      <p>Attack on Titan</p>
    </div>

    <div class="anime-card">
      <img src="https://i.imgur.com/7QpVJpN.jpg">
      <p>One Piece</p>
    </div>
  </div>
</div>

<footer>
  © 2026 - موقع أنمي | تصميم شيشتاوي 😎
</footer>

</body>
</html>
